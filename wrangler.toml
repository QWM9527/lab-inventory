# ============================================================
#  实验室物资清点 —— Cloudflare Pages（国内可直连的版本）
#
#  为什么用 Pages：workers.dev 域名在中国大陆被 DNS 污染（解析到假 IP）打不开，
#  而 pages.dev 没有被污染、Cloudflare 的 IP 国内也能连通，
#  所以同一套代码再发一份到 Pages，得到一个不用梯子就能打开的网址。
#
#  发布：
#     node cloudflare/build-pages.js
#     npx wrangler pages deploy dist --project-name=lab-inventory-qwm9527 --branch=main
#  发布后网址形如 https://lab-inventory-qwm9527.pages.dev
#
#  （Workers 版的配置在 wrangler.workers.toml）
# ============================================================

name = "lab-inventory-qwm9527"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# 和 Workers 版共用同一个云端数据库
[[d1_databases]]
binding = "DB"
database_name = "lab-inventory"
database_id = "1c8764cf-36f8-40de-a071-d94d725d222b"
