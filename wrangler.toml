# ============================================================
#  实验室物资清点 —— Cloudflare Workers 部署配置
#  部署步骤见 README.md 的「六、部署到 Cloudflare（云端版）」
# ============================================================

name = "lab-inventory"
main = "cloudflare/worker.js"
compatibility_date = "2025-01-01"

# 免费版即可；workers.dev 子域名会自动分配
workers_dev = true

# 前端页面直接使用仓库里的 web/ 目录（和本机版共用同一套文件）
[assets]
directory = "web"
binding = "ASSETS"

# 云数据库（已创建）：npx wrangler d1 create lab-inventory
[[d1_databases]]
binding = "DB"
database_name = "lab-inventory"
database_id = "1c8764cf-36f8-40de-a071-d94d725d222b"
